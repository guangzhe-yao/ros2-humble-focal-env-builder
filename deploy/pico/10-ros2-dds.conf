# Larger UDP buffers for ROS 2 DDS traffic.
# Required when CycloneDDS is configured with SocketReceiveBufferSize min=10MB
# and strongly recommended for images, point clouds, maps, and reliable topics.
net.core.rmem_max=67108864
net.core.rmem_default=67108864
net.core.wmem_max=67108864
net.core.wmem_default=67108864
net.ipv4.ipfrag_time=3
net.ipv4.ipfrag_high_thresh=134217728
